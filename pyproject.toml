[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-clv"
version = "2.0.0"
description = "Household churn-proxy, CLV and campaign analytics on the Complete Journey US grocery loyalty data"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
  "duckdb", "pandas", "pyarrow", "numpy", "scikit-learn", "lightgbm", "shap",
  "lifetimes", "matplotlib", "pyyaml", "click", "joblib", "scipy",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter", "nbconvert", "ipykernel"]
app = ["streamlit"]
report = ["markdown", "weasyprint"]

[project.scripts]
churn = "churn_clv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/churn_clv/features.py" = ["E501"]
"src/churn_clv/pipeline.py" = ["E501"]   # inline SQL summary queries
"scripts/build_memo.py" = ["E501"]   # memo template text
"scripts/make_notebooks.py" = ["E501"]  # notebook cell sources
"app/views/*.py" = ["E501"]  # long f-string narrative text
"tests/*.py" = ["E501"]
